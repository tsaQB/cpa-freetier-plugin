name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu zip

      - name: Build Linux AMD64 (.so)
        run: |
          mkdir -p build/amd64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=gcc \
            go build -buildmode=c-shared -ldflags="-s -w" -o build/amd64/cpa-freetier-plugin.so main.go
          cp plugin.json build/amd64/cpa-freetier-plugin.json
          cd build/amd64
          zip ../../cpa-freetier-plugin_linux_amd64.zip cpa-freetier-plugin.so cpa-freetier-plugin.json
          cd ../..

      - name: Build Linux ARM64 (.so)
        run: |
          mkdir -p build/arm64
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -buildmode=c-shared -ldflags="-s -w" -o build/arm64/cpa-freetier-plugin.so main.go
          cp plugin.json build/arm64/cpa-freetier-plugin.json
          cd build/arm64
          zip ../../cpa-freetier-plugin_linux_arm64.zip cpa-freetier-plugin.so cpa-freetier-plugin.json
          cd ../..

      - name: Determine Tag and Version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Prepare Standard Store Assets
        run: |
          VER="${{ steps.tag.outputs.version }}"
          cp cpa-freetier-plugin_linux_amd64.zip "cpa-freetier-plugin_${VER}_linux_amd64.zip"
          cp cpa-freetier-plugin_linux_arm64.zip "cpa-freetier-plugin_${VER}_linux_arm64.zip"

      - name: Generate Checksums
        run: |
          sha256sum cpa-freetier-plugin*.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            cpa-freetier-plugin*.zip
            checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
