name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'
      skip_release:
        description: 'Build and test everything, but do not publish a GitHub release'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-linux-windows:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            os: linux
            arch: amd64
            ext: so
            cc: gcc
            packages: zip
          - target: linux_arm64
            os: linux
            arch: arm64
            ext: so
            cc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross zip
          - target: windows_amd64
            os: windows
            arch: amd64
            ext: dll
            cc: x86_64-w64-mingw32-gcc
            packages: gcc-mingw-w64-x86-64-posix zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Determine Tag and Version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Compile Shared Library
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p build/${{ matrix.target }}
          go build -buildmode=c-shared -trimpath -ldflags="-s -w -X main.pluginVersion=${{ steps.tag.outputs.version }}" -o build/${{ matrix.target }}/cpa-freetier-plugin.${{ matrix.ext }} .
          sed 's/"entrypoint": "cpa-freetier-plugin.so"/"entrypoint": "cpa-freetier-plugin.${{ matrix.ext }}"/' plugin.json > build/${{ matrix.target }}/cpa-freetier-plugin.json

      - name: Package Release Archives
        run: |
          VER="${{ steps.tag.outputs.version }}"
          mkdir -p dist
          cd build/${{ matrix.target }}
          zip ../../dist/cpa-freetier-plugin_${{ matrix.target }}.zip cpa-freetier-plugin.${{ matrix.ext }} cpa-freetier-plugin.json
          zip ../../dist/cpa-freetier-plugin_${VER}_${{ matrix.target }}.zip cpa-freetier-plugin.${{ matrix.ext }} cpa-freetier-plugin.json
          cd ../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 1

  build-darwin:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin_arm64
            arch: arm64
            cflags: "-arch arm64"
          - target: darwin_amd64
            arch: amd64
            cflags: "-arch x86_64"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Determine Tag and Version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Compile Shared Library
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_CFLAGS: ${{ matrix.cflags }}
          CGO_LDFLAGS: ${{ matrix.cflags }}
        run: |
          mkdir -p build/${{ matrix.target }}
          go build -buildmode=c-shared -trimpath -ldflags="-s -w -X main.pluginVersion=${{ steps.tag.outputs.version }}" -o build/${{ matrix.target }}/cpa-freetier-plugin.dylib .
          sed 's/"entrypoint": "cpa-freetier-plugin.so"/"entrypoint": "cpa-freetier-plugin.dylib"/' plugin.json > build/${{ matrix.target }}/cpa-freetier-plugin.json

      - name: Package Release Archives
        run: |
          VER="${{ steps.tag.outputs.version }}"
          mkdir -p dist
          cd build/${{ matrix.target }}
          zip ../../dist/cpa-freetier-plugin_${{ matrix.target }}.zip cpa-freetier-plugin.dylib cpa-freetier-plugin.json
          zip ../../dist/cpa-freetier-plugin_${VER}_${{ matrix.target }}.zip cpa-freetier-plugin.dylib cpa-freetier-plugin.json
          cd ../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 1

  verify:
    name: Verify (vet, tests, model catalogue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Unit tests
        run: CGO_ENABLED=1 go test ./...

      # Fails when the plugin advertises a model id the upstream catalogue dropped
      # (v1.2.4 shipped five dead Kilo ids and three router-map entries with no
      # catalogue entry).
      - name: Every advertised model still exists upstream
        run: ./scripts/check-models.sh main.go

      # Version metadata used to drift: main.go, plugin.json and the README were
      # bumped by hand. plugin.json is now checked against the tag before release.
      - name: Version metadata matches the tag
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "not a tag build — skipping the version match check"
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          PLUGIN_VER="$(python3 -c 'import json;print(json.load(open("plugin.json"))["version"])')"
          if [ "$PLUGIN_VER" != "$VER" ]; then
            echo "::error::plugin.json version ($PLUGIN_VER) does not match tag ($TAG)"
            exit 1
          fi
          echo "plugin.json version matches tag $TAG"

  portability:
    name: Tests on ${{ matrix.os }} (cgo)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # The plugin is cgo (c-shared), so the tests need a C compiler even to
      # build. macOS ships clang; Windows does not ship one on PATH.
      - name: Install MinGW
        if: runner.os == 'Windows'
        shell: bash
        run: choco install mingw -y --no-progress

      - name: Locate MinGW
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gcc_path="$(find /c/ProgramData /c/tools -name gcc.exe -print -quit 2>/dev/null)"
          if [ -z "$gcc_path" ]; then
            echo "::error::no C compiler found — cgo tests cannot build"
            exit 1
          fi
          bin_dir="$(dirname "$gcc_path")"
          echo "using $bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Vet
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: Unit tests
        env:
          CGO_ENABLED: '1'
        run: go test ./...

      # Compiling the shared library is the check the release build depends on.
      - name: Build shared library
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          ext="${{ runner.os == 'Windows' && 'dll' || 'dylib' }}"
          mkdir -p build/portability
          if go build -buildmode=c-shared -trimpath -o "build/portability/cpa-freetier-plugin.${ext}" . 2>&1 | tee build-portability.log; then
            ls -la build/portability
          else
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -8 build-portability.log)
            exit 1
          fi

  cross-compile:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_arm64
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            toolchain: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            ext: so
          - target: windows_amd64
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            toolchain: gcc-mingw-w64-x86-64-posix
            ext: dll
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.toolchain }}

      - name: Build shared library
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          set -o pipefail
          ${{ matrix.cc }} --version
          mkdir -p build/${{ matrix.target }}
          # c-shared needs a platform-appropriate extension (.so / .dll): the
          # linker derives the import library from it.
          if go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
               -o "build/${{ matrix.target }}/cpa-freetier-plugin.${{ matrix.ext }}" . 2>&1 | tee build-${{ matrix.target }}.log; then
            ls -la build/${{ matrix.target }}
          else
            # The job log is not always retrievable, but workflow annotations are:
            # surface the real linker error here.
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -8 build-${{ matrix.target }}.log)
            exit 1
          fi

  release:
    name: Publish Full-Platform Release
    needs: [verify, portability, cross-compile, build-linux-windows, build-darwin]
    # A manual run can therefore exercise every build and test job without
    # publishing anything: workflow_dispatch with skip_release=true.
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_release != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag and Version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
